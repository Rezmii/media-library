name: Keep Supabase Alive

# Utrzymuje projekt Supabase (free tier) przy zyciu wykonujac REALNE zapytanie
# SQL przez bezposrednie polaczenie Postgres (psql). To ten sam rodzaj
# aktywnosci co normalne uzycie aplikacji (Prisma -> Supavisor -> Postgres),
# wiec resetuje 7-dniowy licznik auto-pauzy.
#
# Dlaczego nie REST (/rest/v1) jak wczesniej: przy RLS deny-all anon SELECT
# zwracal pusto i najwyrazniej NIE liczyl sie jako aktywnosc bazy. Bezposrednie
# zapytanie SQL (jako rola postgres) omija PostgREST i RLS - liczy sie zawsze.
#
# Codziennie + ponowienia: pojedynczy nieudany/pominiety run (GitHub bywa
# opozniony) zostawia 6 dni marginesu do progu pauzy, zamiast luki 7 dni.

on:
  schedule:
    - cron: '23 8 * * *' # codziennie 08:23 UTC
  workflow_dispatch: # mozliwosc recznego uruchomienia z zakladki Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Realne zapytanie do bazy (z ponowieniami)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Proba $attempt: SELECT do bazy..."
            if psql "$DB_URL" -tAc 'select count(*) from "MediaItem";'; then
              echo "OK - aktywnosc bazy zarejestrowana (reset licznika pauzy)."
              exit 0
            fi
            echo "Nieudana proba $attempt. Ponawiam za 30s..."
            sleep 30
          done
          echo "::error::Nie udalo sie odpytac bazy po 5 probach."
          exit 1
